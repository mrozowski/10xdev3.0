name: Deploy 10x Games to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - '10xgames/**'
      - '.github/workflows/deploy-10xgames.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          path: ./10xgames
          node-version: 22
          package-manager: npm@latest

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
